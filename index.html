<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h1 { margin-bottom: 20px; color: #1a1a1a; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .status { padding: 10px; border-radius: 6px; margin-bottom: 20px; font-weight: 500; }
        .status.connected { background: #dcfce7; color: #166534; }
        .status.disconnected { background: #fee2e2; color: #991b1b; }
        .last-scan { font-size: 1.2em; font-weight: bold; color: #2563eb; min-height: 1.5em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Inventory Scanner</h1>
        <div id="status" class="status disconnected">Disconnected</div>
        <div id="reader"></div>
        <p>Last Scanned:</p>
        <div id="last-scan" class="last-scan">-</div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const lastScanDiv = document.getElementById('last-scan');
        let socket;

        // Get IP from URL query parameter (e.g., ?ip=192.168.1.5)
        const urlParams = new URLSearchParams(window.location.search);
        const targetIp = urlParams.get('ip');

        function connect() {
            if (!targetIp) {
                statusDiv.textContent = "Error: No IP provided in QR code";
                return;
            }

            socket = new WebSocket(`ws://${targetIp}:8765`);

            socket.onopen = () => {
                statusDiv.textContent = "🟢 Connected to PC";
                statusDiv.className = "status connected";
            };

            socket.onclose = () => {
                statusDiv.textContent = "🔴 Disconnected - Reconnecting...";
                statusDiv.className = "status disconnected";
                setTimeout(connect, 2000);
            };

            socket.onerror = (err) => {
                console.error("Socket error", err);
                socket.close();
            };
        }

        function onScanSuccess(decodedText, decodedResult) {
            lastScanDiv.textContent = decodedText;
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(decodedText);
                // Optional: Add a beep sound here
            }
        }

        if (targetIp) {
            connect();
            const html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: 250 }
            );
            html5QrcodeScanner.render(onScanSuccess);
        } else {
            statusDiv.textContent = "Scan the QR code on your PC app to start.";
        }
    </script>
</body>
</html>
