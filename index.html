<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwinOne Scanner</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { 
            font-family: sans-serif; 
            background: #1a1a1a; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .container { width: 100%; max-width: 400px; text-align: center; }
        #reader { 
            width: 100%; 
            border-radius: 10px; 
            overflow: hidden; 
            background: #000; 
            margin-bottom: 20px; 
            min-height: 300px; 
        }
        .status { padding: 15px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; font-size: 1em; }
        .connected { background: #10B981; color: white; }
        .disconnected { background: #EF4444; color: white; }
        .warning { background: #F59E0B; color: white; }
        .info { background: #3B82F6; color: white; }
        .scanned-data { 
            font-size: 1.4em; 
            color: #6366F1; 
            margin-top: 10px; 
            min-height: 2em; 
            word-break: break-all; 
            padding: 15px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 8px;
            border: 2px solid rgba(99, 102, 241, 0.3);
        }
        .scanned-data.pulse {
            animation: pulse 0.5s ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); background: rgba(16, 185, 129, 0.3); }
        }
        h2 { margin-bottom: 10px; font-size: 1.5em; }
        p { color: #aaa; font-size: 0.9em; margin: 10px 0 5px 0; }
        .info-box { 
            background: rgba(59, 130, 246, 0.2); 
            color: white; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            font-size: 0.9em;
            border: 1px solid rgba(59, 130, 246, 0.5);
        }
        .step { margin: 8px 0; text-align: left; }
        .step-number { 
            display: inline-block; 
            background: white; 
            color: #3B82F6; 
            width: 24px; 
            height: 24px; 
            border-radius: 50%; 
            text-align: center; 
            line-height: 24px; 
            font-weight: bold; 
            margin-right: 8px; 
        }
        .scan-count {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #10B981;
            padding: 8px 15px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📦 Inventory Scanner</h2>
        
        <div id="connection-status" class="status info">Ready to scan QR code</div>
        
        <div id="instructions" class="info-box">
            <div class="step">
                <span class="step-number">1</span>
                Allow camera access when prompted
            </div>
            <div class="step">
                <span class="step-number">2</span>
                Point camera at QR code on your PC
            </div>
            <div class="step">
                <span class="step-number">3</span>
                Start scanning product barcodes
            </div>
        </div>
        
        <div id="reader"></div>
        
        <div id="scan-stats" class="scan-count hidden">
            Scans sent: <span id="scan-count">0</span>
        </div>
        
        <p>Last Scanned:</p>
        <div id="last-scanned" class="scanned-data">-</div>
    </div>
    
    <script>
        const statusDiv = document.getElementById('connection-status');
        const lastScannedDiv = document.getElementById('last-scanned');
        const instructionsDiv = document.getElementById('instructions');
        const scanStatsDiv = document.getElementById('scan-stats');
        const scanCountSpan = document.getElementById('scan-count');
        
        let socket;
        let isScanning = true;
        let html5QrcodeScanner;
        let isConnectedToPc = false;
        let scanCount = 0;

        // Get IP from URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        let pcIp = urlParams.get('ip');

        function connectWebSocket(ip) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }

            statusDiv.innerText = "🔄 Connecting to PC at " + ip + "...";
            statusDiv.className = "status warning";

            try {
                socket = new WebSocket(`ws://${ip}:8765`);

                socket.onopen = () => {
                    statusDiv.innerText = "🟢 Connected to PC - Start scanning!";
                    statusDiv.className = "status connected";
                    isConnectedToPc = true;
                    instructionsDiv.classList.add('hidden');
                    scanStatsDiv.classList.remove('hidden');
                    
                    // Vibrate on successful connection
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200]);
                    }
                };

                socket.onclose = () => {
                    statusDiv.innerText = "🔴 Disconnected - Reconnecting...";
                    statusDiv.className = "status disconnected";
                    isConnectedToPc = false;
                    setTimeout(() => connectWebSocket(ip), 3000);
                };

                socket.onerror = (error) => {
                    console.error("WebSocket Error:", error);
                    statusDiv.innerText = "❌ Connection failed - Check PC app";
                    statusDiv.className = "status disconnected";
                };

                socket.onmessage = (event) => {
                    // Handle acknowledgment from server if needed
                    console.log("Server response:", event.data);
                };
                
            } catch (error) {
                statusDiv.innerText = "❌ Connection error: " + error.message;
                statusDiv.className = "status disconnected";
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanning) return;

            isScanning = false;

            // Check if this is a setup QR code (contains IP parameter)
            if (decodedText.includes('?ip=') || decodedText.match(/\d+\.\d+\.\d+\.\d+/)) {
                handleSetupQR(decodedText);
            } else if (isConnectedToPc) {
                // This is a product barcode - send to PC
                handleBarcodeScanning(decodedText);
            } else {
                // Scanned a barcode but not connected
                lastScannedDiv.innerText = decodedText;
                statusDiv.innerText = "⚠️ Scan QR code on PC first to connect";
                statusDiv.className = "status warning";
            }

            setTimeout(() => { isScanning = true; }, 1500);
        }

        function handleSetupQR(qrText) {
            // Extract IP from QR code
            let ip = null;
            const ipMatch = qrText.match(/ip=([0-9.]+)/);
            if (ipMatch) {
                ip = ipMatch[1];
            } else {
                // Try to extract raw IP
                const rawIpMatch = qrText.match(/(\d+\.\d+\.\d+\.\d+)/);
                if (rawIpMatch) {
                    ip = rawIpMatch[1];
                }
            }

            if (ip) {
                pcIp = ip;
                lastScannedDiv.innerText = "✅ QR Code: " + ip;
                lastScannedDiv.classList.add('pulse');
                setTimeout(() => lastScannedDiv.classList.remove('pulse'), 500);
                
                statusDiv.innerText = "✅ QR Scanned! Connecting to PC...";
                statusDiv.className = "status info";
                
                // Vibrate for confirmation
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100, 50, 100]);
                }
                
                // Connect after brief delay
                setTimeout(() => {
                    connectWebSocket(pcIp);
                }, 1000);
            } else {
                statusDiv.innerText = "❌ Invalid QR code - no IP found";
                statusDiv.className = "status disconnected";
            }
        }

        function handleBarcodeScanning(barcode) {
            lastScannedDiv.innerText = barcode;
            lastScannedDiv.classList.add('pulse');
            setTimeout(() => lastScannedDiv.classList.remove('pulse'), 500);

            // Send to WebSocket
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(barcode);
                scanCount++;
                scanCountSpan.innerText = scanCount;
                
                // Visual feedback
                statusDiv.innerText = "✅ Sent to PC: " + barcode;
                statusDiv.className = "status connected";
                
                // Vibrate on successful scan
                if (navigator.vibrate) {
                    navigator.vibrate(100);
                }
                
                // Reset status message after 2 seconds
                setTimeout(() => {
                    if (isConnectedToPc) {
                        statusDiv.innerText = "🟢 Connected to PC - Ready for next scan";
                        statusDiv.className = "status connected";
                    }
                }, 2000);
            } else {
                statusDiv.innerText = "❌ Not connected - reconnecting...";
                statusDiv.className = "status disconnected";
                connectWebSocket(pcIp);
            }
        }

        function onScanError(error) {
            // Suppress frequent scanning errors
        }

        // Initialize scanner immediately
        function initScanner() {
            statusDiv.innerText = "📸 Requesting camera access...";
            statusDiv.className = "status info";
            
            try {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { 
                        fps: 10, 
                        qrbox: { width: 250, height: 250 },
                        rememberLastUsedCamera: true,
                        aspectRatio: 1.0,
                        showTorchButtonIfSupported: true
                    }
                );
                
                html5QrcodeScanner.render(onScanSuccess, onScanError);
                
                // If IP already in URL, auto-connect
                if (pcIp) {
                    setTimeout(() => {
                        connectWebSocket(pcIp);
                    }, 1000);
                } else {
                    statusDiv.innerText = "📷 Camera ready - Scan QR code on PC";
                    statusDiv.className = "status info";
                }
                
            } catch (error) {
                console.error("Scanner initialization error:", error);
                statusDiv.innerText = "❌ Error: " + error.message;
                statusDiv.className = "status disconnected";
            }
        }

        // Start scanner on page load
        window.addEventListener('load', () => {
            initScanner();
        });
    </script>
</body>
</html>

        }
